name: cqa-local

services:
  app:
    build: .
    container_name: cqa-local-app
    restart: unless-stopped
    env_file:
      - .env
    # APP_ENV=production is intentional: the image serves the built SPA only in
    # production mode, and this value overrides the same key from .env.
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cqa_file_storage:/var/lib/cqa/files
    networks:
      default:
      local-proxy:
        aliases:
          - cqa-app

  db:
    image: mysql:8.0
    container_name: cqa-local-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cqa}
      MYSQL_USER: ${DB_USER:-cqa}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cqa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

volumes:
  cqa_mysql_data:
    name: chat-quality-agent_cqa_mysql_data
  cqa_file_storage:
    name: chat-quality-agent_cqa_file_storage

networks:
  local-proxy:
    external: true
